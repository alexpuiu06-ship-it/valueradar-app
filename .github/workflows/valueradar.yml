name: ValueRadar / actualizare date
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "runner.py"
      - "odds_scanner.py"
      - "performance.py"
      - "docs/index.html"
      - "docs/odds_ui.js"
      - ".github/workflows/valueradar.yml"
  schedule:
    - cron: "23 */4 * * *"
    - cron: "13 8,16 * * *"
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: valueradar-refresh
  # An older stuck Pages deployment must not block newer code.
  cancel-in-progress: true
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verificare modele
        run: python runner.py --self-test
      - name: Verifica sintaxa si testele de integrare
        run: |
          python -m py_compile runner.py odds_scanner.py performance.py
          node --check docs/odds_ui.js
          python odds_scanner.py --self-test
          python performance.py --self-test
      - name: Importa rezultate si calculeaza predictii
        run: python runner.py
      - name: Interogheaza cotele reale (doar 2 ori pe zi sau manual)
        if: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '13 8,16 * * *' }}
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_REGION: uk
        run: python odds_scanner.py
      - name: Auditeaza retrospectiv observatiile cotelor
        run: python performance.py
      - name: Pastreaza jurnalul si analizele
        run: |
          set -euo pipefail
          git config user.name "valueradar-bot"
          git config user.email "valueradar-bot@users.noreply.github.com"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          cp docs/*.json "$tmp/"
          # Discard only the old local git snapshot, NOT generated outputs.
          # The repository may have been edited while today's API collection ran.
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp "$tmp/"*.json docs/
            git add docs/*.json
            if git diff --cached --quiet; then
              echo "No changed data files to commit"
              break
            fi
            git commit -m "Refresh data and audit [skip ci]"
            if git push origin main; then
              echo "Data committed on attempt $attempt"
              break
            fi
            if [ "$attempt" = "3" ]; then
              echo "Data save conflict unresolved" >&2
              exit 1
            fi
          done
      - name: Pregateste fisierele site-ului
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
  deploy:
    needs: analyze
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publica dashboardul
        id: deployment
        uses: actions/deploy-pages@v4

# Dashboard ValueRadar: deploy from docs/, not from Jekyll root.
