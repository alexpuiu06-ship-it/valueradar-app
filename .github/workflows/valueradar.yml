name: ValueRadar / actualizare date
on:
  workflow_dispatch:
    inputs:
      scan_odds:
        description: "Interogheaza cotele internationale (consuma credite API)"
        type: boolean
        required: false
        default: false
      refresh_research:
        description: "Recalculeaza si publica toate rapoartele de cercetare"
        type: boolean
        required: false
        default: false
      probe_ro:
        description: "Verifica diagnosticul agregat RO (maximum 5 cereri gratuite, fara recomandari)"
        type: boolean
        required: false
        default: false
      probe_scores:
        description: "Verifica scoruri pentru maximum 5 meciuri arhivate (maximum 12 cereri din planul gratuit)"
        type: boolean
        required: false
        default: false
  push:
    branches: [main]
    paths:
      - "*.py"
      - "scripts/**"
      - "docs/*.html"
      - "docs/*.js"
      - ".github/workflows/valueradar.yml"
      - ".github/workflows/model_lab.yml"
      - ".github/workflows/elo.yml"
  schedule:
    - cron: "23 */4 * * *"
    - cron: "13 8,16 * * *"
    - cron: "41 5 * * 0"
    - cron: "37 6 * * *"
permissions:
  contents: read
concurrency:
  # Shared by every writer; do not cancel during journal save or Pages deploy.
  group: valueradar-production-writer
  cancel-in-progress: false
jobs:
  analyze:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      saved_sha: ${{ steps.save.outputs.saved_sha }}
      generated_at: ${{ steps.validated.outputs.generated_at }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Retine revizia exacta a codului si jurnalului
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verificari inainte de import
        run: |
          python scripts/check_syntax.py
          python -m unittest discover -s tests -v
          cp docs/forecast_log.json "$RUNNER_TEMP/forecast_log_before.json"
      - name: Import unic, analize si rapoarte coerente
        env:
          REFRESH_RESEARCH: ${{ github.event_name == 'push' || inputs.refresh_research || github.event.schedule == '41 5 * * 0' }}
          SCAN_ODDS: ${{ (github.event_name == 'workflow_dispatch' && inputs.scan_odds) || github.event.schedule == '13 8,16 * * *' }}
          PROBE_RO: ${{ (github.event_name == 'workflow_dispatch' && inputs.probe_ro) || github.event.schedule == '37 6 * * *' }}
          PROBE_SCORES: ${{ (github.event_name == 'workflow_dispatch' && inputs.probe_scores) || github.event.schedule == '41 5 * * 0' }}
          ODDS_API_KEY: ${{ ((github.event_name == 'workflow_dispatch' && inputs.scan_odds) || github.event.schedule == '13 8,16 * * *') && secrets.ODDS_API_KEY || '' }}
          PROPLINE_API_KEY: ${{ ((github.event_name == 'workflow_dispatch' && inputs.probe_ro) || github.event.schedule == '37 6 * * *') && secrets.PROPLINE_API_KEY || '' }}
          ODDSPAPI_API_KEY: ${{ ((github.event_name == 'workflow_dispatch' && inputs.probe_scores) || github.event.schedule == '41 5 * * 0') && secrets.ODDSPAPI_API_KEY || '' }}
          ODDS_REGION: uk
        run: python scripts/run_pipeline.py
      - name: Auditeaza observatiile si valideaza fisierele generate
        id: validated
        run: |
          python scripts/validate_outputs.py --original-log "$RUNNER_TEMP/forecast_log_before.json"
      - name: Salveaza exclusiv fisierele detinute, numai daca main nu s-a schimbat
        id: save
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: python scripts/publish_generated.py refresh --expected-sha "$SOURCE_SHA"
      - name: Pregateste publicarea din aceeasi revizie verificata
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
  deploy:
    needs: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.analyze.outputs.saved_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refuza publicarea unui snapshot depasit de alt commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SAVED_SHA: ${{ needs.analyze.outputs.saved_sha }}
        run: |
          set -euo pipefail
          current_sha="$(gh api "repos/$REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [ "$current_sha" != "$SAVED_SHA" ]; then
            echo "main advanced after analysis; refuse stale deployment" >&2
            exit 1
          fi
      - name: Publica dashboardul si asteapta confirmarea GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000
      - name: Verifica snapshotul servit de site-ul public
        id: public_check
        continue-on-error: true
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_GENERATED_AT: ${{ needs.analyze.outputs.generated_at }}
        run: python scripts/verify_live_site.py
      - name: Refuza si republicarea daca main a avansat in timpul verificarii publice
        if: ${{ steps.public_check.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SAVED_SHA: ${{ needs.analyze.outputs.saved_sha }}
        run: |
          set -euo pipefail
          current_sha="$(gh api "repos/$REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [ "$current_sha" != "$SAVED_SHA" ]; then
            echo "main advanced during public verification; refuse stale redelivery" >&2
            exit 1
          fi
      - name: Republica o singura data acelasi artefact daca Pages serveste fisiere vechi
        if: ${{ steps.public_check.outcome == 'failure' }}
        id: redelivery
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000
      - name: Verificare finala obligatorie dupa republicare
        if: ${{ steps.public_check.outcome == 'failure' }}
        env:
          SITE_URL: ${{ steps.redelivery.outputs.page_url }}
          EXPECTED_GENERATED_AT: ${{ needs.analyze.outputs.generated_at }}
        run: python scripts/verify_live_site.py
