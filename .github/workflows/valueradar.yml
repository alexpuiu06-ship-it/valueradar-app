name: ValueRadar / actualizare date
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "runner.py"
      - "odds_scanner.py"
      - "docs/index.html"
      - ".github/workflows/valueradar.yml"
  schedule:
    - cron: "23 */4 * * *"
    - cron: "13 8,16 * * *"
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: valueradar-refresh
  cancel-in-progress: false
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verificare modele
        run: python runner.py --self-test
      - name: Verifica integrarea de cote
        run: python odds_scanner.py --self-test
      - name: Importa rezultate si calculeaza predictii
        run: python runner.py
      - name: Interogheaza cotele reale (doar 2 ori pe zi sau manual)
        if: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '13 8,16 * * *' }}
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_REGION: uk
        run: python odds_scanner.py
      - name: Pastreaza jurnalul si analizele
        run: |
          git config user.name "valueradar-bot"
          git config user.email "valueradar-bot@users.noreply.github.com"
          git add docs/*.json
          if ! git diff --cached --quiet; then
            git commit -m "Update experimental forecasts [skip ci]"
            git push
          fi
      - name: Pregateste fisierele site-ului
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
  deploy:
    needs: analyze
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publica dashboardul
        id: deployment
        uses: actions/deploy-pages@v4

# Dashboard ValueRadar: deploy from docs/, not from Jekyll root.
