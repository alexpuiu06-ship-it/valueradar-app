name: ValueRadar / evaluare gratuita feed RO
on:
  workflow_dispatch:
    inputs:
      provider:
        description: "Furnizor gratuit pentru diagnostic, fara cumparare"
        type: choice
        options: [PropLine, OddsPapi, OddsPapi scores]
        default: PropLine
      authenticated:
        description: "Verifica cu cheia furnizorului (maxim 5 PropLine / 12 OddsPapi cereri gratuite)"
        type: boolean
        default: false
      league:
        description: "Liga pentru test"
        type: choice
        options: [All leagues, Premier League, La Liga, Serie A, Bundesliga, Ligue 1]
        default: Premier League
      inspect_stale:
        description: "Inspecteaza ultima ora pentru diagnostic; cotele acceptate raman la 120 secunde"
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: valueradar-ro-feed-probe
  cancel-in-progress: false
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        league: ${{ inputs.provider == 'PropLine' && inputs.league == 'All leagues' && fromJSON('["Premier League","La Liga","Serie A","Bundesliga","Ligue 1"]') || fromJSON(format('["{0}"]', inputs.league)) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Evalueaza metadatele publice sau o singura cerere autentificata
        if: ${{ inputs.provider == 'PropLine' }}
        env:
          PROPLINE_API_KEY: ${{ inputs.authenticated && secrets.PROPLINE_API_KEY || '' }}
          AUTHENTICATED_PROBE: ${{ inputs.authenticated }}
          PROBE_LEAGUE: ${{ matrix.league }}
          INSPECT_STALE: ${{ inputs.inspect_stale }}
        run: python ro_feed_probe.py
      - name: Evalueaza alternativa OddsPapi cu buget si fara cote salvate
        if: ${{ inputs.provider == 'OddsPapi' }}
        env:
          ODDSPAPI_API_KEY: ${{ inputs.authenticated && secrets.ODDSPAPI_API_KEY || '' }}
          AUTHENTICATED_PROBE: ${{ inputs.authenticated }}
          PROBE_LEAGUE: ${{ matrix.league }}
        run: python oddspapi_probe.py
      - name: Verifica scoruri finale gratuite pentru estimarile in asteptare
        if: ${{ inputs.provider == 'OddsPapi scores' }}
        env:
          ODDSPAPI_API_KEY: ${{ inputs.authenticated && secrets.ODDSPAPI_API_KEY || '' }}
          AUTHENTICATED_PROBE: ${{ inputs.authenticated }}
          PROBE_LEAGUE: ${{ matrix.league }}
        run: python scores_probe.py
      - name: Pastreaza doar diagnosticul agregat, fara cote brute
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ro-feed-preflight-${{ matrix.league }}
          path: work/*preflight.json
          retention-days: 14
