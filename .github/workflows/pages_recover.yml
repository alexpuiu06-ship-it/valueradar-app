name: ValueRadar / deblocare GitHub Pages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages_recover.yml"
permissions:
  pages: write
  contents: read
jobs:
  unblock:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Anuleaza numai deploymentul blocat identificat in log
        env:
          GH_TOKEN: \${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sha="45a3a3fed1abd7a50b1d3f6777cc26b41351a297"
          http=$(curl --retry 2 -sS -o /dev/null -w '%{http_code}' \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/\${{ github.repository }}/pages/deployments/$sha/cancel")
          echo "Pages stale deployment cancellation status: $http"
          if [ "$http" != "204" ] && [ "$http" != "404" ]; then exit 1; fi
