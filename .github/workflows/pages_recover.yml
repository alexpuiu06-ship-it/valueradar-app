name: ValueRadar / recuperare manuala GitHub Pages
on:
  workflow_dispatch:
    inputs:
      deployment_id:
        description: "ID al deploymentului blocat, copiat exact din logul GitHub Pages"
        required: true
        type: string
permissions:
  contents: read
  pages: write
concurrency:
  group: valueradar-pages-recovery
  cancel-in-progress: false
jobs:
  unblock:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verifica starea si anuleaza numai deploymentul cerut explicit
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_ID: ${{ inputs.deployment_id }}
        run: python scripts/recover_pages.py
