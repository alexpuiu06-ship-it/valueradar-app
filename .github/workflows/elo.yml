name: ValueRadar / model Elo candidat (artefacte)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: valueradar-research-independent-elo-${{ github.ref }}
  cancel-in-progress: true
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cercetare independenta fara salvare sau publicare
        run: python elo_challenger.py
      - uses: actions/upload-artifact@v4
        with:
          name: independent-elo
          path: |
            docs/elo_challenger.json
          retention-days: 14
